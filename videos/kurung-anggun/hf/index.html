<!doctype html>
<html
  lang="ms"
  data-resolution="portrait"
  data-composition-variables='[{"id":"productName","type":"string","label":"Product name","default":"Kurung Anggun"},{"id":"cta","type":"string","label":"Call to action","default":"Tekan beg kuning"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #efdcd6;
        --ink: #5e1622;
        --font-display: "Playfair Display", serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24.5" data-width="1080" data-height="1920">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="3.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="songket" data-composition-id="songket" data-composition-src="compositions/songket.html" data-start="3.2" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="zip" data-composition-id="zip" data-composition-src="compositions/zip.html" data-start="6.2" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="bunga" data-composition-id="bunga" data-composition-src="compositions/bunga.html" data-start="9.2" data-duration="2.4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="comfort" data-composition-id="comfort" data-composition-src="compositions/comfort.html" data-start="11.6" data-duration="3.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="sizes" data-composition-id="sizes" data-composition-src="compositions/sizes.html" data-start="14.8" data-duration="2.8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="colours" data-composition-id="colours" data-composition-src="compositions/colours.html" data-start="17.6" data-duration="3.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="20.8" data-duration="3.7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- ASMR sound: a quiet room bed, and one close-mic sound per visible action -->
      <audio id="sfx-room" class="clip" src="assets/sfx/room.mp3" data-start="0" data-duration="22" data-volume="0.35" data-fade-in="0.3" data-fade-out="1.5" data-track-index="10"></audio>
      <audio id="sfx-steps" class="clip" src="assets/sfx/steps.mp3" data-start="0.1" data-volume="1" data-track-index="11"></audio>
      <audio id="sfx-rustle-b" class="clip" src="assets/sfx/rustle-b.mp3" data-start="3.25" data-volume="1" data-track-index="12"></audio>
      <audio id="sfx-zip" class="clip" src="assets/sfx/zip.mp3" data-start="6.6" data-volume="1" data-track-index="13"></audio>
      <audio id="sfx-brooch" class="clip" src="assets/sfx/tap-b.mp3" data-start="8.3" data-volume="0.9" data-track-index="14"></audio>
      <audio id="sfx-tap-bunga" class="clip" src="assets/sfx/tap-a.mp3" data-start="9.55" data-volume="1" data-track-index="15"></audio>
      <audio id="sfx-swish" class="clip" src="assets/sfx/swish.mp3" data-start="11.65" data-volume="1" data-track-index="16"></audio>
      <audio id="sfx-rustle-a" class="clip" src="assets/sfx/rustle-a.mp3" data-start="13.1" data-volume="0.8" data-track-index="17"></audio>
      <audio id="sfx-tap-size1" class="clip" src="assets/sfx/tap-a.mp3" data-start="15.3" data-volume="0.7" data-track-index="18"></audio>
      <audio id="sfx-tap-size2" class="clip" src="assets/sfx/tap-b.mp3" data-start="16.2" data-volume="0.7" data-track-index="19"></audio>
      <audio id="sfx-swish-2" class="clip" src="assets/sfx/swish.mp3" data-start="17.6" data-volume="0.8" data-track-index="20"></audio>
      <audio id="sfx-tap-colour" class="clip" src="assets/sfx/tap-a.mp3" data-start="19.5" data-volume="0.6" data-track-index="21"></audio>
      <audio id="sfx-steps-end" class="clip" src="assets/sfx/steps.mp3" data-start="20.85" data-volume="0.8" data-track-index="22"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
