<!doctype html>
<html lang="ms" data-composition-variables='[{"id":"presenter","type":"image","label":"Presenter","default":"assets/presenter.png"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />

    <style>
      :root {
        --coral: #e8623a;
        --coral-soft: #ff9670;
        --ink: #2a1f1c;
        --cream: #f5efe9;
        --card: rgba(255, 255, 255, 0.96);
        --green: #22b357;
        --font-sans: "Montserrat", sans-serif;
        --font-ui: "Inter", sans-serif;
        --font-serif: "Playfair Display", serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #1b1716;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #cam {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 1;
      }
      #cam-move {
        position: absolute;
        inset: 0;
      }
      #presenter {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      #shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.45) 0%,
          rgba(0, 0, 0, 0) 26%,
          rgba(0, 0, 0, 0) 60%,
          rgba(0, 0, 0, 0.35) 100%
        );
      }

      /* Shared overlay pieces used by every scene */
      .card {
        position: absolute;
        background: var(--card);
        border-radius: 34px;
        box-shadow: 0 24px 60px rgba(30, 15, 10, 0.28);
        font-family: var(--font-ui);
        color: var(--ink);
      }
      .kicker {
        display: inline-block;
        background: var(--coral);
        color: #fff;
        font-family: var(--font-ui);
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 0.12em;
        padding: 8px 22px;
        border-radius: 999px;
      }
      .serif-title {
        font-family: var(--font-serif);
        font-weight: 700;
        color: #fff;
        text-shadow: 0 6px 30px rgba(0, 0, 0, 0.45);
        line-height: 1.02;
        letter-spacing: -0.01em;
      }
      .serif-title em {
        color: #ff7448;
        text-shadow: 0 2px 4px rgba(60, 20, 10, 0.55), 0 6px 30px rgba(0, 0, 0, 0.5);
        font-style: italic;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        border-radius: 999px;
        font-family: var(--font-ui);
        font-weight: 700;
        font-size: 30px;
        padding: 14px 26px;
      }
      .chip-dark {
        background: #1e1816;
        color: #fff;
      }
      .chip-light {
        background: #fff;
        color: var(--ink);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.25);
      }
      .spark {
        color: var(--coral);
      }
    </style>
  </head>

    <script>
      const tl = gsap.timeline({ paused: true });
      const cam = "#cam-move";
      // Shots. Origin at the bottom edge keeps the chin clear of the card zone as we push in.
      const WIDE = 1.04, CARD = 1.1, MED = 1.18, CLOSE = 1.32;
      tl.set(cam, { transformOrigin: "50% 100%", scale: WIDE, x: 0, y: 0 }, 0);
      const shot = (t, scale, dur, end, x = 0) => {
        tl.set(cam, { scale, x }, t);
        if (end) tl.to(cam, { scale: end, duration: dur, ease: "none" }, t);
      };
      const push = (t, scale, dur = 0.5) =>
        tl.to(cam, { scale, duration: dur, ease: "power3.out" }, t);

      shot(0, WIDE, 2.7, 1.08);
      shot(2.79, CLOSE, 1.3, 1.36, -10);       // "CapCut" jump-in
      shot(4.15, CARD, 1.9, 1.13);
      shot(6.05, CARD, 2.9, 1.15);
      shot(9.03, WIDE, 1.95, 1.07);
      shot(11.0, MED, 2.3, 1.2, 8);         // "open source"
      shot(13.31, CARD, 5.3, 1.14);
      shot(18.67, MED, 1.2, 1.2);
      push(19.9, 1.1, 0.4);
      shot(35.92, CARD, 1.3, 1.12);
      shot(37.24, MED, 1.1, 1.2, -12);
      shot(38.36, CARD, 5.0, 1.12);
      shot(43.4, 1.42, 2.7, 1.5);              // "Makin jelas" close-up
      shot(46.12, WIDE, 2.2, 1.08);
      shot(48.36, CARD, 2.55, 1.13);
      shot(50.92, CARD, 1.4, 1.14);
      tl.set(cam, { scale: WIDE }, 52.36);
      tl.to(cam, { scale: 1.1, duration: 3.6, ease: "none" }, 52.4);
      shot(56.04, WIDE, 5.0, 1.1);
      shot(61.04, CLOSE, 1.08, 1.36);          // "Senang je kan?"
      shot(62.12, WIDE, 1.3, 1.07);
      tl.to(cam, { scale: 1.06, duration: 2.4, ease: "none" }, 63.45);

      window.__timelines["main"] = tl;
    </script>
